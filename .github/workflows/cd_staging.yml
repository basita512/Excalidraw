name: Deploy to staging
on: 
  push:
    branches:
      - "main"

jobs:
  redeploy_frontend:
    name: Deploy everything(http/ws/fe) to staging
    runs-on: ubuntu-latest
    steps:
    - name: ssh into staging server
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
        chmod 600 ~/ssh_key
        ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@56.228.42.84 "sudo bash -s" << 'EOF'
          cd /root/Excalidraw
          git pull origin main
          pnpm install
          pnpm run build
          pm2 restart frontend-server
          pm2 restart http-server
          pm2 restart ws-server
        EOF
          
        